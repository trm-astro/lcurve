[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "lcurve"
version = "0.4.6"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "tests" },
]
tests = [
    "pytest",
    "pytest-cov",
    "nox",
]
docs = [
    "sphinx",
    "myst-nb",
    "myst-parser",
    "pydata-sphinx-theme",
]
